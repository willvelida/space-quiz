<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Quiz — Test Your Space Knowledge</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f1ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #fff;
      --text: #17142d;
      --muted: #6d6984;
      --border: #ded9f1;
      --primary: #6753d8;
      --primary-dark: #523fc0;
      --primary-soft: #ece8ff;
      --correct: #168356;
      --correct-soft: #dcf8ea;
      --wrong: #d43e50;
      --wrong-soft: #ffe3e7;
      --shadow: 0 24px 60px rgba(61, 45, 119, 0.16);
      --panel-grid: rgba(103, 83, 216, 0.055);
      --panel-edge: rgba(103, 83, 216, 0.28);
      --status: #168356;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #100e20;
        --surface: rgba(29, 26, 51, 0.9);
        --surface-solid: #1d1a33;
        --text: #f4f1ff;
        --muted: #aaa5c3;
        --border: #393451;
        --primary: #a495ff;
        --primary-dark: #b5a9ff;
        --primary-soft: #302a5c;
        --correct: #4ed69b;
        --correct-soft: #173e32;
        --wrong: #ff7382;
        --wrong-soft: #4a202a;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        --panel-grid: rgba(164, 149, 255, 0.06);
        --panel-edge: rgba(164, 149, 255, 0.3);
        --status: #4ed69b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(150, 122, 255, 0.24), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255, 144, 105, 0.16), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -12%;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(circle, color-mix(in srgb, var(--text) 42%, transparent) 0 1px, transparent 1.5px),
        radial-gradient(circle, color-mix(in srgb, var(--primary) 42%, transparent) 0 1px, transparent 1.6px),
        radial-gradient(circle, color-mix(in srgb, var(--text) 28%, transparent) 0 0.7px, transparent 1.2px);
      background-position: 0 0, 37px 53px, 71px 19px;
      background-size: 118px 126px, 173px 181px, 91px 103px;
      opacity: 0.58;
      animation: star-drift 32s linear infinite, twinkle 5s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    body::before {
      transform: rotate(3deg);
    }

    body::after {
      background-position: 24px 61px, 93px 11px, 7px 82px;
      background-size: 151px 163px, 207px 193px, 127px 139px;
      opacity: 0.3;
      filter: blur(0.25px);
      animation-duration: 48s, 7s;
      animation-delay: -19s, -2s;
    }

    .app {
      width: min(100%, 520px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      font-size: 19px;
      box-shadow: 0 8px 20px rgba(103, 83, 216, 0.28);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 6vw, 38px);
      border: 1px solid var(--panel-edge);
      border-radius: 8px;
      clip-path: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
      background:
        linear-gradient(var(--panel-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--panel-grid) 1px, transparent 1px),
        var(--surface);
      background-size: 24px 24px, 24px 24px, auto;
      box-shadow:
        var(--shadow),
        inset 0 0 0 4px color-mix(in srgb, var(--surface-solid) 65%, transparent),
        inset 0 0 40px color-mix(in srgb, var(--primary) 4%, transparent);
      backdrop-filter: blur(18px);
    }

    .card .scanline {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--primary) 7%, transparent) 50%, transparent 100%);
      background-size: 100% 160px;
      opacity: 0.7;
      pointer-events: none;
      animation: console-scan 9s linear infinite;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      z-index: 2;
      width: 28px;
      height: 28px;
      pointer-events: none;
    }

    .card::before {
      top: 9px;
      left: 9px;
      border-top: 2px solid var(--primary);
      border-left: 2px solid var(--primary);
      border-radius: 5px 0 0;
    }

    .card::after {
      right: 9px;
      bottom: 9px;
      border-right: 2px solid var(--primary);
      border-bottom: 2px solid var(--primary);
      border-radius: 0 0 5px;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -12px 0 26px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--panel-edge);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .console-header::before {
      content: "●  ●  ●";
      position: absolute;
      left: 50%;
      color: var(--panel-edge);
      font-size: 7px;
      letter-spacing: 5px;
      transform: translateX(-50%);
    }

    .system-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--status);
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--status) 16%, transparent), 0 0 10px currentColor;
      animation: status-pulse 2s ease-in-out infinite;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.03em;
    }

    .score {
      color: var(--primary);
      padding: 4px 8px;
      border: 1px solid var(--panel-edge);
      border-radius: 5px;
      background: color-mix(in srgb, var(--primary-soft) 72%, transparent);
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      margin-bottom: 34px;
      padding: 2px;
      border: 1px solid var(--panel-edge);
      border-radius: 4px;
      background:
        repeating-linear-gradient(90deg, transparent 0 8%, var(--surface-solid) 8% 10%),
        var(--primary-soft);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: 1px;
      background: linear-gradient(90deg, #7764e8, #a45de0);
      box-shadow: 0 0 12px color-mix(in srgb, var(--primary) 55%, transparent);
      transition: width 450ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    h1 {
      max-width: 430px;
      margin-bottom: 26px;
      font-size: clamp(24px, 6vw, 32px);
    }

    h2 {
      font-size: clamp(28px, 7vw, 38px);
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-solid);
      color: var(--text);
      font: inherit;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 8px 22px rgba(74, 55, 151, 0.12);
    }

    .answer:focus-visible,
    .next-button:focus-visible,
    .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 42%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled {
      cursor: default;
    }

    .answer-letter {
      flex: 0 0 auto;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--panel-edge);
      border-radius: 3px;
      background: var(--primary-soft);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 850;
    }

    .console-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 -13px;
      padding-top: 11px;
      border-top: 1px solid var(--panel-edge);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .signal-bars {
      display: inline-flex;
      align-items: end;
      gap: 2px;
      height: 10px;
    }

    .signal-bars span {
      width: 3px;
      background: var(--status);
      border-radius: 1px 1px 0 0;
    }

    .signal-bars span:nth-child(1) { height: 4px; }
    .signal-bars span:nth-child(2) { height: 7px; }
    .signal-bars span:nth-child(3) { height: 10px; }

    .answer.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
      color: var(--correct);
      animation: pop 400ms ease;
    }

    .answer.correct .answer-letter {
      background: var(--correct);
      color: white;
    }

    .answer.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
      color: var(--wrong);
      animation: shake 420ms ease;
    }

    .answer.wrong .answer-letter {
      background: var(--wrong);
      color: white;
    }

    .answer.dimmed {
      opacity: 0.52;
    }

    .feedback {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
    }

    .feedback.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .feedback-copy {
      margin: 0;
      font-weight: 750;
    }

    .feedback-copy.correct-copy {
      color: var(--correct);
    }

    .feedback-copy.wrong-copy {
      color: var(--wrong);
    }

    .next-button,
    .restart-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(103, 83, 216, 0.22);
      transition: transform 160ms ease, background 160ms ease;
    }

    .next-button {
      padding: 11px 15px;
    }

    .restart-button {
      margin-top: 26px;
      padding: 13px 21px;
    }

    .next-button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      background: var(--primary-dark);
    }

    .results {
      position: relative;
      display: none;
      text-align: center;
    }

    .results.visible {
      display: block;
      animation: rise 500ms ease both;
    }

    .results > :not(.celebration) {
      position: relative;
      z-index: 1;
    }

    .results.celebrating .reaction {
      background: linear-gradient(135deg, #ffe46b, #ff9a62);
      box-shadow:
        0 0 0 8px color-mix(in srgb, #ffd45c 18%, transparent),
        0 0 42px color-mix(in srgb, #ffb45c 52%, transparent);
      animation: victory-float 1.4s ease-in-out infinite;
    }

    .results.celebrating .final-score {
      background: linear-gradient(90deg, #ff9e45, #ffdc60, var(--primary));
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px color-mix(in srgb, #ffb34f 25%, transparent));
    }

    .celebration {
      position: absolute;
      inset: -40px -22px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .celebration-spark {
      position: absolute;
      top: 42%;
      left: 50%;
      width: var(--size);
      height: var(--size);
      border-radius: 2px;
      background: var(--spark-color);
      opacity: 0;
      transform: translate(-50%, -50%) rotate(0);
    }

    .results.celebrating .celebration-spark {
      animation: spark-burst 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) var(--delay) both;
    }

    .quiz.hidden {
      display: none;
    }

    .reaction {
      display: inline-grid;
      width: 94px;
      height: 94px;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 28px;
      background: var(--primary-soft);
      font-size: 52px;
      animation: float 2.5s ease-in-out infinite;
    }

    .result-label {
      margin: 10px 0 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .final-score {
      margin: 0;
      color: var(--primary);
      font-size: clamp(42px, 12vw, 62px);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .result-message {
      max-width: 340px;
      margin: 18px auto 0;
      color: var(--muted);
    }

    .review {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--panel-edge);
      text-align: left;
    }

    .review-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .review-summary,
    .review-perfect {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .review-perfect {
      padding: 16px;
      border: 1px solid var(--correct);
      border-radius: 5px;
      background: var(--correct-soft);
      color: var(--correct);
      font-weight: 750;
    }

    .review-list {
      display: grid;
      gap: 14px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      counter-reset: missed-question;
    }

    .review-item {
      padding: 16px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--wrong);
      border-radius: 5px;
      background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
      counter-increment: missed-question;
    }

    .review-question {
      display: flex;
      gap: 9px;
      margin: 0 0 13px;
      font-size: 16px;
      line-height: 1.35;
    }

    .review-question::before {
      content: counter(missed-question, decimal-leading-zero);
      flex: 0 0 auto;
      color: var(--wrong);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    .review-answers {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .review-answer {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
    }

    .review-answer dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .review-answer dd {
      margin: 0;
      font-weight: 700;
    }

    .review-answer.selected dd {
      color: var(--wrong);
    }

    .review-answer.correct dd {
      color: var(--correct);
    }

    .review-fact {
      margin: 13px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes victory-float {
      0%, 100% { transform: translateY(0) rotate(-5deg) scale(1); }
      50% { transform: translateY(-10px) rotate(5deg) scale(1.06); }
    }

    @keyframes spark-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(0) scale(0);
      }
      14% {
        opacity: 1;
      }
      72% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--spin)) scale(0.6);
      }
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 0.58; }
    }

    @keyframes star-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(42px, 28px, 0); }
    }

    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @keyframes console-scan {
      from { background-position: 0 -160px; }
      to { background-position: 0 calc(100% + 160px); }
    }

    @media (max-width: 440px) {
      .card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .console-header {
        margin-top: -8px;
      }

      .console-header::before {
        display: none;
      }

      .feedback {
        align-items: stretch;
        flex-direction: column;
      }

      .next-button {
        width: 100%;
      }

      .review-answer {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none;
        will-change: auto;
      }

      .card .scanline {
        display: none;
      }

      .celebration {
        display: none;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span> Orbit Quiz</div>
    <section class="card" aria-live="polite">
      <div class="scanline" aria-hidden="true"></div>
      <div class="console-header" aria-hidden="true">
        <span class="system-status"><span class="status-light"></span>Systems online</span>
        <span>MC-01 / Training</span>
      </div>
      <div class="quiz" id="quiz">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score" id="score">Score: 0</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="eyebrow" id="category">The Solar System</p>
        <h1 id="question">Which planet is known as the Red Planet?</h1>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback">
          <p class="feedback-copy" id="feedback-copy"></p>
          <button class="next-button" id="next-button" type="button">Next →</button>
        </div>
      </div>

      <div class="results" id="results">
        <div class="celebration" id="celebration" aria-hidden="true"></div>
        <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h2 id="result-title">Stellar work!</h2>
        <p class="result-label">Your final score</p>
        <p class="final-score"><span id="final-score">0</span>/10</p>
        <p class="result-message" id="result-message"></p>
        <section class="review" aria-labelledby="review-title">
          <h3 class="review-title" id="review-title">Mission review</h3>
          <div id="review-content"></div>
        </section>
        <button class="restart-button" id="restart-button" type="button">Launch again</button>
      </div>
      <div class="console-footer" aria-hidden="true">
        <span>Uplink stable</span>
        <span class="signal-bars"><span></span><span></span><span></span></span>
        <span>Telemetry / Live</span>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "The Solar System",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars gets its rusty color from iron minerals in its soil."
      },
      {
        category: "Historic Missions",
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Sally Ride"],
        correct: 2,
        fact: "Neil Armstrong stepped onto the lunar surface in July 1969."
      },
      {
        category: "Deep Space",
        question: "What is the name of our galaxy?",
        answers: ["Andromeda", "Milky Way", "Sombrero", "Whirlpool"],
        correct: 1,
        fact: "The Milky Way is a barred spiral galaxy containing our Solar System."
      },
      {
        category: "Planetary Science",
        question: "Which planet has the most prominent ring system?",
        answers: ["Neptune", "Uranus", "Saturn", "Jupiter"],
        correct: 2,
        fact: "Saturn's rings are made mostly of ice particles, rock, and dust."
      },
      {
        category: "Stars",
        question: "What type of star is the Sun?",
        answers: ["Red giant", "White dwarf", "Neutron star", "Yellow dwarf"],
        correct: 3,
        fact: "The Sun is a G-type main-sequence star, often called a yellow dwarf."
      },
      {
        category: "Spacecraft",
        question: "Which space telescope launched in December 2021?",
        answers: ["Hubble", "James Webb", "Kepler", "Spitzer"],
        correct: 1,
        fact: "The James Webb Space Telescope observes primarily in infrared light."
      },
      {
        category: "Moons",
        question: "What is the largest moon in our Solar System?",
        answers: ["Titan", "Europa", "Ganymede", "Earth's Moon"],
        correct: 2,
        fact: "Jupiter's Ganymede is even larger than the planet Mercury."
      },
      {
        category: "Human Spaceflight",
        question: "What was the first reusable spacecraft?",
        answers: ["Apollo", "Soyuz", "Space Shuttle", "Dragon"],
        correct: 2,
        fact: "NASA's Space Shuttle was the first reusable orbital spacecraft."
      },
      {
        category: "Cosmic Mysteries",
        question: "What is the boundary around a black hole called?",
        answers: ["Event horizon", "Photon belt", "Accretion edge", "Singularity"],
        correct: 0,
        fact: "Beyond the event horizon, not even light can escape the black hole."
      },
      {
        category: "Astronomy",
        question: "Which planet is closest to the Sun?",
        answers: ["Venus", "Earth", "Mars", "Mercury"],
        correct: 3,
        fact: "Mercury orbits just 58 million kilometers from the Sun on average."
      }
    ];

    const quiz = document.querySelector("#quiz");
    const results = document.querySelector("#results");
    const questionCount = document.querySelector("#question-count");
    const scoreElement = document.querySelector("#score");
    const progressBar = document.querySelector("#progress-bar");
    const progressTrack = document.querySelector(".progress-track");
    const category = document.querySelector("#category");
    const questionElement = document.querySelector("#question");
    const answersElement = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const feedbackCopy = document.querySelector("#feedback-copy");
    const nextButton = document.querySelector("#next-button");
    const restartButton = document.querySelector("#restart-button");
    const celebration = document.querySelector("#celebration");
    const reviewContent = document.querySelector("#review-content");

    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    const selectedAnswers = Array(questions.length).fill(null);

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreElement.textContent = `Score: ${score}`;
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
      category.textContent = item.category;
      questionElement.textContent = item.question;
      feedback.classList.remove("visible");
      answersElement.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersElement.append(button);
      });
    }

    function selectAnswer(selectedIndex, selectedButton) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const buttons = [...answersElement.children];
      selectedAnswers[currentQuestion] = selectedIndex;
      buttons.forEach((button) => {
        button.disabled = true;
      });

      if (selectedIndex === item.correct) {
        score += 1;
        selectedButton.classList.add("correct");
        feedbackCopy.textContent = `Correct! ${item.fact}`;
        feedbackCopy.className = "feedback-copy correct-copy";
      } else {
        selectedButton.classList.add("wrong");
        buttons[item.correct].classList.add("correct");
        buttons.forEach((button, index) => {
          if (index !== selectedIndex && index !== item.correct) button.classList.add("dimmed");
        });
        feedbackCopy.textContent = `Not quite. ${item.fact}`;
        feedbackCopy.className = "feedback-copy wrong-copy";
      }

      scoreElement.textContent = `Score: ${score}`;
      nextButton.textContent = currentQuestion === questions.length - 1 ? "See results →" : "Next →";
      feedback.classList.add("visible");
      nextButton.focus();
    }

    function renderReview() {
      const missedQuestions = questions
        .map((item, index) => ({ item, selectedIndex: selectedAnswers[index] }))
        .filter(({ item, selectedIndex }) => selectedIndex !== item.correct);

      reviewContent.replaceChildren();

      if (missedQuestions.length === 0) {
        const confirmation = document.createElement("p");
        confirmation.className = "review-perfect";
        confirmation.textContent = "Perfect flight — there are no missed questions to review.";
        reviewContent.append(confirmation);
        return;
      }

      const summary = document.createElement("p");
      summary.className = "review-summary";
      summary.textContent = `Review ${missedQuestions.length} missed ${missedQuestions.length === 1 ? "question" : "questions"} before your next launch.`;

      const list = document.createElement("ol");
      list.className = "review-list";

      missedQuestions.forEach(({ item, selectedIndex }) => {
        const listItem = document.createElement("li");
        listItem.className = "review-item";

        const question = document.createElement("h4");
        question.className = "review-question";
        question.textContent = item.question;

        const answers = document.createElement("dl");
        answers.className = "review-answers";

        [
          ["Your answer", item.answers[selectedIndex], "selected"],
          ["Correct answer", item.answers[item.correct], "correct"]
        ].forEach(([label, answer, className]) => {
          const answerRow = document.createElement("div");
          answerRow.className = `review-answer ${className}`;

          const term = document.createElement("dt");
          term.textContent = label;

          const description = document.createElement("dd");
          description.textContent = answer;

          answerRow.append(term, description);
          answers.append(answerRow);
        });

        const fact = document.createElement("p");
        fact.className = "review-fact";
        fact.textContent = item.fact;

        listItem.append(question, answers, fact);
        list.append(listItem);
      });

      reviewContent.append(summary, list);
    }

    function showResults() {
      quiz.classList.add("hidden");
      results.classList.add("visible");
      results.classList.toggle("celebrating", score >= 8);
      document.querySelector("#final-score").textContent = score;
      renderReview();

      const reaction = document.querySelector("#reaction");
      const title = document.querySelector("#result-title");
      const message = document.querySelector("#result-message");

      celebration.replaceChildren();
      if (score >= 8) {
        const colors = ["#ffd45c", "#ff7d72", "#8c7cff", "#4ed69b", "#68c8ff"];
        for (let index = 0; index < 24; index += 1) {
          const spark = document.createElement("span");
          const angle = (Math.PI * 2 * index) / 24;
          const distance = 135 + (index % 5) * 13;
          spark.className = "celebration-spark";
          spark.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          spark.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          spark.style.setProperty("--size", `${5 + (index % 4) * 2}px`);
          spark.style.setProperty("--spin", `${180 + index * 29}deg`);
          spark.style.setProperty("--delay", `${(index % 6) * 35}ms`);
          spark.style.setProperty("--spark-color", colors[index % colors.length]);
          celebration.append(spark);
        }
      }

      if (score >= 9) {
        reaction.textContent = "🌟";
        title.textContent = "Cosmic genius!";
        message.textContent = "An exceptional mission. You clearly know your way around the universe.";
      } else if (score >= 7) {
        reaction.textContent = "🚀";
        title.textContent = "Stellar work!";
        message.textContent = "You flew through that mission with serious space knowledge.";
      } else if (score >= 4) {
        reaction.textContent = "🛰️";
        title.textContent = "Nice orbit!";
        message.textContent = "A solid flight. A little more training and you'll reach the stars.";
      } else {
        reaction.textContent = "👽";
        title.textContent = "Keep exploring!";
        message.textContent = "Every astronaut starts somewhere. Launch again and discover more.";
      }

      restartButton.focus();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (currentQuestion === questions.length - 1) {
        showResults();
        return;
      }
      currentQuestion += 1;
      renderQuestion();
    });

    restartButton.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      selectedAnswers.fill(null);
      results.classList.remove("visible");
      results.classList.remove("celebrating");
      celebration.replaceChildren();
      reviewContent.replaceChildren();
      quiz.classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
